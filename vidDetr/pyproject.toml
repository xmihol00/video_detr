[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidDetr"
version = "0.1.0"
description = "VideoDETR – Video Object Detection and Tracking with Transformers"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"

dependencies = [
    "torch>=1.10.0",
    "torchvision>=0.11.0",
    "pycocotools>=2.0",
    "scipy",
    "Pillow",
    "PyYAML",
    "tqdm",
    "matplotlib",
    "opencv-python",
    "numpy",
]

[project.optional-dependencies]
tao = ["tao"]  # TAO benchmark toolkit
dev = [
    "pytest",
    "mypy",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["vidDetr*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]   # line length handled by formatter

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
